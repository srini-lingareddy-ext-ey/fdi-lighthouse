$schema: https://azuremlschemas.azureedge.net/latest/schedule.schema.json
name: lighthouse-monthly
display_name: Lighthouse monthly forecast
description: Run the Lighthouse pipeline on the 1st of every month at 02:00 UTC.

trigger:
  type: recurrence
  frequency: month
  interval: 1
  schedule:
    hours: [2]
    minutes: [0]
    month_days: [1]
  time_zone: UTC

create_job: ./pipeline.yaml
