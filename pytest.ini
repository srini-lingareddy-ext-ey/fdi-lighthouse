[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add project root to Python path
pythonpath = .

# Coverage options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=lh_v2
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may hit external resources)
    slow: Tests that take a long time to run
    data_loading: Tests related to data loading
    driver_analysis: Tests related to driver analysis
    forecasting: Tests related to forecasting
    stats: Tests related to statistical functions

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.14
