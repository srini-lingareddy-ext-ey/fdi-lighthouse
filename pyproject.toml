[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["lh_v2"]

[project]
name = "lh-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.5.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "optuna>=4.6.0",
    "plotly>=6.5.0",
    "pmdarima>=2.1.1",
    "polars>=1.37.1",
    "prophet>=1.2.1",
    "pydantic>=2.12.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "statsmodels>=0.14.6",
    "tbats>=1.1.3",
    "xgboost>=3.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
format = "cd $(git rev-parse --show-toplevel) && ruff format ."
check = "cd $(git rev-parse --show-toplevel) && pyright ."
test = "cd $(git rev-parse --show-toplevel) && pytest"

test-cov = """
cd $(git rev-parse --show-toplevel) && \
pytest --cov=lh_v2 --cov-report=html --cov-report=term
"""

test-unit = "cd $(git rev-parse --show-toplevel) && pytest -m unit"
test-integration = "cd $(git rev-parse --show-toplevel) && pytest -m integration"
test-verbose = "cd $(git rev-parse --show-toplevel) && pytest -vv"
verify = "task format && task test && task check"

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
enableExperimentalFeatures = true
typeCheckingMode = "strict"
# reportUnnecessaryTypeIgnoreComment = "error"
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false